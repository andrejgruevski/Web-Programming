
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workshop Registration - Choose a Workshop</title>

    <style>
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        .error {
            color: red;
        }

        .workshop-option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .workshop-option:hover {
            background-color: #f5f5f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        td form {
            margin: 0;
        }

        .add-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .edit-link {
            color: #007bff;
            text-decoration: none;
        }

        .delete-button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>

<main>

    <!-- Error message -->
    <p class="error"
       th:if="${errorMessage != null}"
       th:text="${errorMessage}">
    </p>

    <!-- Search form -->
    <form th:action="@{/workshops}" method="GET">
        <h2>Search workshops:</h2>

        <label>Title or category contains:</label>
        <input type="text"
               name="text">

        <label>Max price:</label>
        <input type="number"
               name="maxPrice"
               min="0"
               step="0.01">

        <button type="submit">Search</button>
    </form>

    <!-- List and management of workshops -->
    <h2>Available Workshops</h2>

    <a class="add-link"
       th:href="@{/workshops/workshop-form}">
        Add New Workshop
    </a>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Price</th>
            <th>Free Seats</th>
            <th>Instructor</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="workshop : ${workshops}">

            <td th:text="${workshop.title}"></td>

            <td th:text="${workshop.category}"></td>

            <td th:text="${workshop.price}"></td>

            <td th:text="${workshop.capacity}"></td>

            <td th:text="|${workshop.instructor.name} ${workshop.instructor.surname}|"></td>

            <td>
                <a class="edit-link"
                   th:href="@{/workshops/workshop-form/{id}(id=${workshop.id})}">
                    Edit
                </a>
            </td>

            <td>
                <form th:action="@{/workshops/delete/{id}(id=${workshop.id})}"
                      method="POST">
                    <button class="delete-button"
                            type="submit">
                        Delete
                    </button>
                </form>
            </td>

        </tr>
        </tbody>
    </table>

    <!-- Registration form -->
    <form th:action="@{/registration}" method="POST">

        <h2>Choose a workshop:</h2>

        <div class="workshop-option"
             th:each="workshop : ${workshops}">

            <label>
                <input type="radio"
                       name="workshopTitle"
                       th:value="${workshop.title}"
                       th:disabled="${workshop.capacity == 0}"
                       required>

                <span th:text="|Title: ${workshop.title},
                    Category: ${workshop.category},
                    Price: ${workshop.price} MKD,
                    Free seats: ${workshop.capacity},
                    Instructor: ${workshop.instructor.name} ${workshop.instructor.surname}|">
                </span>
            </label>

        </div>

        <h2>Enter your information:</h2>

        <label>Your Name:</label>
        <input type="text"
               name="participantName"
               required>
        <br><br>

        <label>Your Email:</label>
        <input type="email"
               name="participantEmail"
               required>
        <br><br>

        <h2>Choose number of seats:</h2>

        <input type="number"
               name="numSeats"
               min="1"
               required>

        <br><br>

        <button type="submit">Register</button>

    </form>

</main>

</body>
</html>
